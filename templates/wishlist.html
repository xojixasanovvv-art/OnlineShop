{% extends "base.html" %}
{% block title %}Sevimlilar — OnlineShop{% endblock %}
{% block content %}
<div class="container" style="padding-top:40px;">
    <div class="section-heading">
        <div>
            <p class="hero-eyebrow" data-i18n="wishlist.desc">Yurak bosgan mahsulotlaringiz</p>
            <h1 data-i18n="wishlist.title">Sevimlilar ♥</h1>
        </div>
        <button class="btn btn-light btn-sm" id="clear-wishlist" data-i18n="wishlist.clear">Tozalash</button>
    </div>

    <div id="wishlist-list" class="products-grid">
        <p class="empty-state" data-i18n="common.loading">Yuklanmoqda...</p>
    </div>
</div>
{% endblock %}
{% block script %}
<script>
    function removeFromWishlistView(productId){
        const card = document.querySelector(`[data-wish-item="${productId}"]`);
        if (card) card.remove();
        if (!document.querySelector('[data-wish-item]')) showEmpty();
        updateWishlistBadge();
    }

    function showEmpty(){
        document.getElementById('wishlist-list').innerHTML =
            `<p class="empty-state">${t('wishlist.empty')}</p>`;
    }

    async function loadWishlist(){
        const token = localStorage.getItem('access_token');
        if (!token){ location.href = '/login-page'; return; }
        const c = document.getElementById('wishlist-list');
        const res = await fetch('/wishlist/', { headers: { 'Authorization': 'Bearer ' + token } });
        if (!res.ok){ c.innerHTML = `<p class="empty-state">${t('common.error')}</p>`; return; }
        const data = await res.json();
        if (!data.items.length){ showEmpty(); return; }

        c.innerHTML = '';
        data.items.forEach(p => {
            const img = p.image_url || '';
            const card = document.createElement('div');
            card.className = 'product-card';
            card.dataset.wishItem = p.id;
            card.innerHTML = `
                <div class="product-image">${img ? `<img src="${esc(safeUrl(img))}" alt="${esc(p.title)}">` : '📦'}</div>
                <div class="product-body">
                    <h3><a href="/product/${esc(p.id)}">${esc(p.title)}</a></h3>
                    <p class="product-desc">${esc((p.description || t('products.noDesc')).slice(0, 80))}</p>
                    <div class="price-row">
                        <span class="price">${fmt(p.price)}</span>
                        <span class="price-unit">so'm</span>
                    </div>
                    <p class="${p.stock === 0 ? 'stock low' : 'stock'}">${p.stock === 0 ? t('products.out') : p.stock + ' ' + t('products.stock')}</p>
                    <div class="card-actions">
                        <button class="btn btn-dark btn-sm" onclick="addFromWishlist(${p.id})" ${p.stock === 0 ? 'disabled' : ''}>${t('products.add')}</button>
                        <a href="/product/${p.id}" class="btn btn-light btn-sm">${t('products.detail')}</a>
                        <button class="heart-btn active" data-pid="${p.id}" onclick="toggleWishlist(${p.id}, this)" aria-pressed="true" title="${t('wishlist.remove')}">♥</button>
                    </div>
                </div>`;
            c.appendChild(card);
        });
    }

    async function addFromWishlist(productId){
        const token = localStorage.getItem('access_token');
        const res = await fetch('/cart/items', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
            body: JSON.stringify({ product_id: productId, quantity: 1 })
        });
        const data = await res.json();
        if (res.ok){ showToast('✓', 'success'); updateCartBadge(); }
        else showToast(data.detail || t('common.error'), 'error');
    }

    document.getElementById('clear-wishlist').addEventListener('click', async () => {
        const token = localStorage.getItem('access_token');
        if (!confirm(t('wishlist.confirm_clear'))) return;
        const res = await fetch('/wishlist/', { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + token } });
        if (res.ok){ localStorage.setItem('wishlist_ids', '[]'); showEmpty(); updateWishlistBadge(); showToast(t('wishlist.cleared'), 'success'); }
    });

    loadWishlist();
    onLangChange(loadWishlist);
</script>
{% endblock %}
